name: Supabase database keepalive

on:
  schedule:
    - cron: '17 9 * * 1' # Mondays at 09:17 UTC
    - cron: '17 9 * * 4' # Thursdays at 09:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run lightweight database ping
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Missing repository secret SUPABASE_DB_URL"
            exit 1
          fi
          psql "$SUPABASE_DB_URL" --no-psqlrc --set=ON_ERROR_STOP=1 --command='SELECT 1;'
